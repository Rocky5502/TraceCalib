name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,ml]'
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Lint
        run: ruff check src scripts tests
      - name: Tests
        run: pytest
      - name: RQ5 synthetic smoke test
        run: python scripts/smoke_rq5.py --output-dir artifacts/smoke/rq5

# Deliberately no model downloads, API calls, Docker benchmark execution, or GPU runs in public CI.
# The RQ5 smoke test uses a deterministic synthetic fixture and never writes to results/.
